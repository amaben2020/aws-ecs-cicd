name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
      - staging

jobs:
  # =========================================================================
  # JOB 1: Environment Orchestrator (Determines where traffic is going)
  # =========================================================================
  orchestrate:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      aws_env: ${{ steps.set-env.outputs.aws_env }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "aws_env=prod" >> $GITHUB_OUTPUT
          else
            echo "aws_env=staging" >> $GITHUB_OUTPUT
          fi

  # =========================================================================
  # JOB 2: Container Build & Publish (per microservice)
  # =========================================================================
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    needs: orchestrate
    runs-on: ubuntu-latest
    # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN live in the AWS-EKS environment, and
    # environment secrets are only readable by jobs that declare that environment.
    environment: AWS-EKS
    strategy:
      matrix:
        service: [users-service, orders-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compile and Push Container
        env:
          DOCKERHUB_REPO: algomachine007/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $DOCKERHUB_REPO:$IMAGE_TAG ./${{ matrix.service }}
          docker push $DOCKERHUB_REPO:$IMAGE_TAG

  # =========================================================================
  # JOB 3: AWS ECS Deployment Management (rolling update, per microservice)
  # =========================================================================
  deploy-to-ecs:
    name: Rollout ${{ matrix.service }}
    needs: [orchestrate, build-and-push]
    runs-on: ubuntu-latest
    environment: AWS-EKS
    strategy:
      matrix:
        # Every one of these names was created by hand in the console and none of
        # them follow a single rule, so they are pinned explicitly rather than
        # derived. Verified against the live cluster:
        #   container    - the container name inside the task definition
        #   prodService  - note orders has NO "-service" suffix, unlike users
        include:
          - service: users-service
            container: users-app
            prodService: users-service-task-service
            stagingService: users-service-staging-task-service
          - service: orders-service
            container: orders-app
            prodService: orders-service-task
            stagingService: orders-service-staging-task-service
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # The image URI is fully deterministic (Docker Hub repo + commit sha), so it's
      # reconstructed here rather than passed through build-and-push's outputs —
      # matrix jobs share one job-level outputs map, so the last matrix branch to finish
      # would silently clobber whatever the other branch wrote there.
      - name: Resolve task family and image for this service
        id: resolve
        run: |
          if [ "${{ needs.orchestrate.outputs.aws_env }}" = "prod" ]; then
            family="${{ matrix.service }}-task"
            svc="${{ matrix.prodService }}"
          else
            family="${{ matrix.service }}-staging-task"
            svc="${{ matrix.stagingService }}"
          fi
          echo "family=$family" >> $GITHUB_OUTPUT
          echo "svc=$svc" >> $GITHUB_OUTPUT
          echo "image=docker.io/algomachine007/${{ matrix.service }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Fetch Remote Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.resolve.outputs.family }} \
            --query taskDefinition > task-definition.json

      - name: Update Target Container Image
        id: render-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.container }}
          image: ${{ steps.resolve.outputs.image }}

      - name: Trigger Rolling Update on AWS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-container.outputs.task-definition }}
          service: ${{ steps.resolve.outputs.svc }}
          cluster: my-ecs-cluster-${{ needs.orchestrate.outputs.aws_env }}
          wait-for-service-stability: true
