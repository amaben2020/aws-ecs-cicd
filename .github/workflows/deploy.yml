name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
      - staging

jobs:
  # =========================================================================
  # JOB 1: Environment Orchestrator (Determines where traffic is going)
  # =========================================================================
  orchestrate:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      aws_env: ${{ steps.set-env.outputs.aws_env }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "aws_env=prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "aws_env=staging" >> $GITHUB_OUTPUT
          fi

  # =========================================================================
  # JOB 2: Container Build & Publish (per microservice)
  # =========================================================================
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    needs: orchestrate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users-service, orders-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compile and Push Container
        env:
          DOCKERHUB_REPO: algomachine007/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $DOCKERHUB_REPO:$IMAGE_TAG ./${{ matrix.service }}
          docker push $DOCKERHUB_REPO:$IMAGE_TAG

  # =========================================================================
  # JOB 4: AWS ECS Deployment Management (rolling update, per microservice)
  # =========================================================================
  deploy-to-ecs:
    name: Rollout ${{ matrix.service }}
    needs: [orchestrate, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.orchestrate.outputs.env_name }}
    strategy:
      matrix:
        service: [users-service, orders-service]
    steps:
      # TEMPORARY DIAGNOSTIC - remove once credentials are confirmed working.
      # Prints only lengths, never values. Expected: 20 and 40.
      # 0 means the secret is not visible to this job (wrong name or wrong scope);
      # 21/41 means a trailing newline or space got saved into the value.
      - name: Verify AWS secrets are visible to this job
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID length:     ${#KEY_ID} (expected 20)"
          echo "AWS_SECRET_ACCESS_KEY length: ${#SECRET_KEY} (expected 40)"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # The image URI is fully deterministic (Docker Hub repo + commit sha), so it's
      # reconstructed here rather than passed through build-and-push's outputs —
      # matrix jobs share one job-level outputs map, so the last matrix branch to finish
      # would silently clobber whatever the other branch wrote there.
      - name: Resolve task family and image for this service
        id: resolve
        run: |
          if [ "${{ needs.orchestrate.outputs.aws_env }}" = "prod" ]; then
            family="${{ matrix.service }}-task"
          else
            family="${{ matrix.service }}-staging-task"
          fi
          echo "family=$family" >> $GITHUB_OUTPUT
          echo "image=docker.io/algomachine007/${{ matrix.service }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Fetch Remote Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.resolve.outputs.family }} \
            --query taskDefinition > task-definition.json

      - name: Update Target Container Image
        id: render-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.resolve.outputs.image }}

      - name: Trigger Rolling Update on AWS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-container.outputs.task-definition }}
          service: ${{ steps.resolve.outputs.family }}-service
          cluster: my-ecs-cluster-${{ needs.orchestrate.outputs.aws_env }}
          wait-for-service-stability: true
