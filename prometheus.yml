global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    scrape_interval: 5s
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'users-microservice'
    scrape_interval: 5s
    static_configs:
      - targets: ['users-service:3000']

  - job_name: 'orders-microservice'
    scrape_interval: 5s
    static_configs:
      - targets: ['orders-service:3000']
